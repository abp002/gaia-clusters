# Publish the 3D viewer on GitHub Pages. The page and its data are in viewer/, built locally by
# scripts/export_viewer.py: the build needs the downloaded stars and the HDBSCAN labels, which are not in
# the repository. Pages serves a private repository only on a paid plan, so the job waits until it is public.
name: Pages

on:
  push:
    branches: [main]
    paths: [viewer/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viewer
      - id: deployment
        uses: actions/deploy-pages@v4
